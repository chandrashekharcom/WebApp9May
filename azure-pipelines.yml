trigger:
- master

pool:
  vmImage: windows-latest

variables:
  projectPath: '**/WebApp9May.csproj' # Simplified for flexibility
  buildConfiguration: 'Release'

steps:
- task: DotNetCoreCLI@2
  displayName: 'Build Project'
  inputs:
    command: 'build'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Publish Project'
  inputs:
    command: 'publish'
    publishWebProjects: true
    # Fixed the extra parenthesis at the end of $(Build.ArtifactStagingDirectory)
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true 

- task: FileTransform@2
  displayName: 'JSON Variable Substitution'
  inputs:
    # Changed from DefaultWorkingDirectory to ArtifactStagingDirectory to match the publish output
    folderPath: '$(Build.ArtifactStagingDirectory)' 
    xmlTransformationRules: ''
    jsonTargetFiles: '**/appsettings.json'

- task: PublishBuildArtifacts@1
  displayName: 'Upload Artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: 'Azure subscription 1(1)(625ce2b7-370d-4af7-9bee-bcceae4ca23b)'
    appType: 'webApp'
    appName: 'WebApp101'
    # Points to the zip file created in the staging directory
    package: '$(Build.ArtifactStagingDirectory)/**/*.zip'